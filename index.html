<div id="anime-list">Loading Anime...</div>

<script>
fetch("https://graphql.anilist.co", {
 method: "POST",
 headers: {"Content-Type":"application/json"},
 body: JSON.stringify({
  query: `{
   Page(perPage:20) {
    media(type:ANIME, sort:POPULARITY_DESC) {
     id
     title { romaji }
     coverImage { large }
     episodes
     seasonYear
    }
   }
  }`
 })
})
.then(r => r.json())
.then(data => {
 document.getElementById("anime-list").innerHTML =
 data.data.Page.media.map(a => `
 <div style="display:inline-block;width:150px;margin:10px">
 <img src="${a.coverImage.large}" width="150">
 <h3>${a.title.romaji}</h3>
 <p>Episodes: ${a.episodes || "Unknown"}</p>
 <p>${a.seasonYear || ""}</p>
 </div>
 `).join("");
})
.catch(() => {
 document.getElementById("anime-list").innerText =
 "Anime loading failed.";
});
</script>
