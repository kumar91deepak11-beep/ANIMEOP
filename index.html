
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANIMEOP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090910;color:white;font-family:Arial}
header{padding:18px;background:#15151f;border-bottom:1px solid #333}
.logo{font-size:27px;font-weight:bold;color:#b56aff}
main{padding:16px;max-width:1100px;margin:auto}
h2{margin-top:25px}
#status{color:#bbb;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:#191923;padding:12px;border-radius:12px;overflow:hidden}
.card h3{font-size:14px;overflow-wrap:anywhere}
.card p{font-size:12px;color:#bbb}
button{background:#963be8;color:white;border:0;border-radius:8px;padding:10px;cursor:pointer}
video{width:100%;background:#000;border-radius:10px;margin-top:10px}
a{color:#c89aff}
#playerBox{display:none;background:#191923;padding:14px;border-radius:12px;margin-top:20px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="logo">ANIMEOP</div></header>
<main>
<h2>Free Anime Videos</h2>
<p>Public domain and selected Creative Commons videos</p>
<p id="status">Loading available videos...</p>
<div class="grid" id="videos"></div>

<div id="playerBox">
<h2 id="playingTitle">Watch</h2>
<video id="player" controls playsinline></video>
<p id="license"></p>
<a id="sourceLink" target="_blank" rel="noopener">View original file and license</a>
</div>
</main>

<script>
const API="https://commons.wikimedia.org/w/api.php";
const grid=document.getElementById("videos");
const statusText=document.getElementById("status");

function allowedLicense(value){
 const s=(value||"").toLowerCase();
 return s.includes("cc by-sa") ||
        s.includes("cc by ") ||
        s.includes("cc0") ||
        s.includes("public domain");
}

async function loadVideos(){
 try{
  const params=new URLSearchParams({
   action:"query",
   generator:"categorymembers",
   gcmtitle:"Category:Anime videos",
   gcmtype:"file",
   gcmlimit:"50",
   prop:"imageinfo",
   iiprop:"url|extmetadata",
   format:"json",
   origin:"*"
  });

  const response=await fetch(API+"?"+params);
  if(!response.ok) throw new Error("API error");
  const data=await response.json();
  const pages=Object.values(data.query?.pages||{});
  let count=0;

  for(const item of pages){
   const info=item.imageinfo?.[0];
   if(!info || !info.url) continue;

   const mime=info.mime||"";
   if(!mime.startsWith("video/")) continue;

   const meta=info.extmetadata||{};
   const license=meta.LicenseShortName?.value||"";
   const terms=meta.UsageTerms?.value||"";
   const creator=meta.Artist?.value||"Creator not listed";

   if(!allowedLicense(license+" "+terms)) continue;

   const title=item.title.replace(/^File:/,"");
   const card=document.createElement("article");
   card.className="card";

   const heading=document.createElement("h3");
   heading.textContent=title;

   const lic=document.createElement("p");
   lic.textContent="License: "+license;

   const credit=document.createElement("p");
   credit.textContent="Creator: "+creator.replace(/<[^>]*>/g,"");

   const play=document.createElement("button");
   play.textContent="WATCH VIDEO";
   play.onclick=()=>playVideo(
     title,info.url,license,creator,info.descriptionurl
   );

   card.append(heading,lic,credit,play);
   grid.appendChild(card);
   count++;
  }

  statusText.textContent=count
   ? count+" matching video files found. Check each original license before reuse."
   : "No matching videos found right now. Try again later.";

 }catch(error){
  statusText.textContent=
   "Videos load nahi hue. Internet connection check karke page refresh karo.";
  console.error(error);
 }
}

function playVideo(title,url,license,creator,source){
 const box=document.getElementById("playerBox");
 const video=document.getElementById("player");

 video.pause();
 video.removeAttribute("src");
 video.load();

 document.getElementById("playingTitle").textContent=title;
 document.getElementById("license").textContent=
  "License: "+license+" | Creator: "+creator.replace(/<[^>]*>/g,"");

 document.getElementById("sourceLink").href=source;
 video.src=url;
 box.style.display="block";
 box.scrollIntoView({behavior:"smooth"});
 video.play().catch(()=>{});
}

loadVideos();
</script>
</body>
</html>
