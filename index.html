<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnimeVerse — Discover Anime</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0b0f19;
      color: #e8ecf5;
      min-height: 100vh;
    }
    header {
      padding: 18px 20px;
      background: linear-gradient(90deg, #141a2e, #1b1030);
      border-bottom: 1px solid #24304d;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .top {
      max-width: 1200px;
      margin: auto;
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }
    .logo {
      font-weight: 800;
      font-size: 22px;
      color: #8b5cf6;
    }
    .logo span { color: #38bdf8; }
    input, select, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid #2b3category;
      outline: none;
    }
    input, select {
      background: #101728;
      color: #e8ecf5;
      border: 1px solid #2b3category;
      padding: 10px 12px;
      min-width: 170px;
    }
    input { flex: 1; min-width: 220px; }
    button {
      background: #8b5cf6;
      color: white;
      border: none;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { background: #7c3aed; }
    main { max-width: 1200px; margin: auto; padding: 24px 20px 60px; }
    .section-title {
      margin: 26px 0 14px;
      font-size: 20px;
      font-weight: 800;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
    }
    .card {
      background: #121a2c;
      border: 1px solid #253252;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease;
    }
    .card:hover { transform: translateY(-4px); border-color: #8b5cf6; }
    .card img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
    }
    .card-body { padding: 10px; }
    .title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta { margin-top: 6px; font-size: 12px; color: #93a4c3; }
    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #1f2a44;
      color: #9ae6b4;
      font-size: 11px;
      font-weight: 700;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 15, .82);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal.open { display: flex; }
    .sheet {
      width: min(860px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #0f1626;
      border: 1px solid #2b3category;
      border-radius: 18px;
      padding: 18px;
    }
    .detail {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 18px;
    }
    @media (max-width: 640px) {
      .detail { grid-template-columns: 1fr; }
    }
    .detail img {
      width: 100%;
      border-radius: 12px;
      aspect-ratio: 2 / 3;
      object-fit: cover;
    }
    h2 { font-size: 22px; margin-bottom: 8px; }
    .desc { color: #b7c2d8; line-height: 1.6; margin: 10px 0 16px; }
    .info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .box {
      background: #16203a;
      border: 1px solid #2b3category;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
    }
    .box b { display: block; color: #8b5cf6; margin-bottom: 3px; }
    .watch {
      display: inline-block;
      background: #22c55e;
      color: #04220f;
      text-decoration: none;
      font-weight: 800;
      padding: 10px 16px;
      border-radius: 10px;
    }
    .mal {
      display: inline-block;
      margin-left: 10px;
      background: #2e63e7;
      color: white;
      text-decoration: none;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 10px;
    }
    .close {
      float: right;
      background: #24304d;
      color: white;
      padding: 8px 12px;
    }
    .empty { color: #93a4c3; padding: 30px 0; text-align: center; }
    .loading { color: #93a4c3; padding: 20px 0; }
    footer {
      text-align: center;
      color: #6b7a97;
      font-size: 12px;
      padding: 24px;
      border-top: 1px solid #202b45;
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div class="logo">Anime<span>Verse</span></div>
      <input id="search" placeholder="Anime search karo… jaise Naruto, One Piece" />
      <select id="filter">
        <option value="trending">Trending</option>
        <option value="airing">Currently Airing</option>
        <option value="upcoming">Upcoming / New</option>
        <option value="popular">All-Time Popular</option>
        <option value="movie">Movies</option>
      </select>
      <button onclick="loadAnime()">Load</button>
    </div>
  </header>

  <main>
    <h1 class="section-title" id="heading">Trending Anime</h1>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">Koi anime nahi mila.</div>
  </main>

  <div class="modal" id="modal">
    <div class="sheet">
      <button class="close" onclick="closeModal()">Close</button>
      <div id="detail"></div>
    </div>
  </div>

  <footer>
    Anime information automatically updates through public anime metadata APIs.
    Streaming links lead to official/legal platforms where available.
  </footer>

  <script>
    const API = "https://api.jikan.moe/v4";
    const grid = document.getElementById("grid");
    const heading = document.getElementById("heading");
    const empty = document.getElementById("empty");
    const modal = document.getElementById("modal");
    const detail = document.getElementById("detail");

    const titles = {
      trending: "Trending Anime",
      airing: "Currently Airing Anime",
      upcoming: "Upcoming / New Anime",
      popular: "All-Time Popular Anime",
      movie: "Popular Anime Movies"
    };

    async function loadAnime() {
      const mode = document.getElementById("filter").value;
      const query = document.getElementById("search").value.trim();

      grid.innerHTML = `<div class="loading">Loading anime…</div>`;
      empty.style.display = "none";
      heading.textContent = query ? `Results for “${query}”` : titles[mode];

      let url;
      if (query) {
        url = `${API}/anime?q=${encodeURIComponent(query)}&limit=24&order_by=members&sort=desc`;
      } else if (mode === "trending") {
        url = `${API}/top/anime?filter=bypopularity&limit=24`;
      } else if (mode === "airing") {
        url = `${API}/top/anime?filter=airing&limit=24`;
      } else if (mode === "upcoming") {
        url = `${API}/seasons/upcoming?limit=24`;
      } else if (mode === "popular") {
        url = `${API}/top/anime?limit=24`;
      } else {
        url = `${API}/top/anime?type=movie&limit=24`;
      }

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("API error");
        const data = await res.json();
        const anime = data.data || [];

        if (!anime.length) {
          grid.innerHTML = "";
          empty.style.display = "block";
          return;
        }

        grid.innerHTML = anime.map(a => `
          <div class="card" onclick='openAnime(${JSON.stringify(a).replace(/'/g, "&#39;")})'>
            <img src="${a.images?.jpg?.large_image_url || ""}" alt="${escapeHtml(a.title || "Anime")}" loading="lazy" />
            <div class="card-body">
              <div class="title">${escapeHtml(a.title || "Unknown")}</div>
              <div class="meta">
                ${a.year || a.aired?.prop?.from?.year || "—"} •
                ${a.type || "TV"}
              </div>
              <span class="badge">★ ${a.score || "N/A"}</span>
            </div>
          </div>
        `).join("");
      } catch (e) {
        grid.innerHTML = `<div class="empty">Anime load nahi hua. Thodi der baad try karo.</div>`;
      }
    }

    async function openAnime(anime) {
      modal.classList.add("open");
      detail.innerHTML = `<div class="loading">Details load ho rahi hain…</div>`;

      try {
        const res = await fetch(`${API}/anime/${anime.mal_id}/full`);
        const { data: a } = await res.json();

        const trailer = a.trailer?.url;
        const streaming = (a.streaming || [])
          .map(s => `<a href="${s.url}" target="_blank" rel="noopener">${escapeHtml(s.name)}</a>`)
          .join(" • ") || "Official platform par availability check karo.";

        detail.innerHTML = `
          <div class="detail">
            <img src="${a.images?.jpg?.large_image_url || ""}" alt="${escapeHtml(a.title || "")}" />
            <div>
              <h2>${escapeHtml(a.title || "")}</h2>
              <div class="meta">${escapeHtml(a.title_english || a.title_japanese || "")}</div>
              <p class="desc">${escapeHtml(a.synopsis || "Synopsis available nahi hai.")}</p>

              <div class="info">
                <div class="box"><b>Score</b>${a.score || "N/A"} / 10</div>
                <div class="box"><b>Episodes</b>${a.episodes || "Unknown"}</div>
                <div class="box"><b>Status</b>${escapeHtml(a.status || "Unknown")}</div>
                <div class="box"><b>Season</b>${escapeHtml((a.season || "—") + " " + (a.year || ""))}</div>
                <div class="box"><b>Studio</b>${escapeHtml(a.studios?.map(s => s.name).join(", ") || "Unknown")}</div>
                <div class="box"><b>Genres</b>${escapeHtml(a.genres?.map(g => g.name).join(", ") || "—")}</div>
              </div>

              <div class="box" style="margin-bottom:16px">
                <b>Legal Watch Options</b>
                ${streaming}
              </div>

              ${trailer ? `<a class="watch" href="${trailer}" target="_blank" rel="noopener">Watch Trailer</a>` : ""}
              <a class="mal" href="${a.url}" target="_blank" rel="noopener">MyAnimeList Page</a>
            </div>
          </div>
        `;
      } catch {
        detail.innerHTML = `<div class="empty">Details load nahi hui.</div>`;
      }
    }

    function closeModal() {
      modal.classList.remove("open");
    }

    modal.addEventListener("click", e => {
      if (e.target === modal) closeModal();
    });

    document.getElementById("search").addEventListener("keydown", e => {
      if (e.key === "Enter") loadAnime();
    });

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    loadAnime();
    setInterval(loadAnime, 10 * 60 * 1000);
  </script>
</body>
</html>
