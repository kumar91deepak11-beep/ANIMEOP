
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMEOP</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080810;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#10101d;border-bottom:1px solid #292044}
.logo{font-size:30px;font-weight:900;color:#a970ff;letter-spacing:2px}
header p{color:#aaa;margin:6px 0 0;font-size:13px}
main{max-width:1200px;margin:auto;padding:18px}
.search{width:100%;padding:15px;border:1px solid #39275e;border-radius:12px;background:#151321;color:white;font-size:16px;outline:none}
.tabs{display:flex;gap:9px;overflow-x:auto;margin:18px 0}
.tabs button,.action{border:0;border-radius:9px;padding:11px 16px;background:#211a35;color:white;cursor:pointer;white-space:nowrap}
.tabs button.active,.action{background:#813cff}
h2{font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:15px}
.card{background:#151321;border:1px solid #28213b;border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#9252ff}
.card img{width:100%;height:210px;object-fit:cover;background:#29213c}
.card h3{font-size:14px;padding:0 10px;margin:10px 0 5px}
.card p{font-size:12px;color:#aaa;padding:0 10px 10px;margin:0}
.status{color:#aaa;text-align:center;padding:25px}
.modal{display:none;position:fixed;inset:0;background:#000e;z-index:5;overflow:auto;padding:15px}
.panel{max-width:850px;margin:20px auto;background:#12111e;border:1px solid #49316e;border-radius:15px;padding:18px}
.close{float:right;background:#302440;color:white;border:0;padding:9px 13px;border-radius:8px}
.details{display:flex;gap:16px;margin:20px 0;align-items:flex-start}
.details img{width:125px;border-radius:10px}
.details h2{margin-top:0}
.muted{color:#aaa;font-size:13px;line-height:1.6}
select{padding:11px;background:#211a35;color:white;border:1px solid #49316e;border-radius:8px;margin:8px 0;width:100%}
.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(75px,1fr));gap:8px;margin:12px 0}
.episodes button{padding:12px 5px;background:#211a35;color:white;border:1px solid #49316e;border-radius:8px;cursor:pointer}
.episodes button:hover{background:#813cff}
.player{margin-top:20px;background:#050508;border-radius:12px;overflow:hidden}
.player iframe,.player video{width:100%;aspect-ratio:16/9;border:0;display:block}
.player-message{padding:35px 15px;text-align:center;color:#bbb}
footer{text-align:center;color:#777;padding:25px;font-size:12px}
@media(max-width:500px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card img{height:200px}
 .details{gap:12px}
 .details img{width:100px}
 .panel{padding:13px;margin:5px auto}
}
</style>
</head>
<body>

<header>
 <div class="logo">ANIMEOP</div>
 <p>Discover Japanese Anime • New & Classic</p>
</header>

<main>
 <input class="search" id="search" placeholder="Search anime..." />
 <div class="tabs">
  <button class="active" data-sort="POPULARITY_DESC">Popular</button>
  <button data-sort="START_DATE_DESC">New Anime</button>
  <button data-sort="START_DATE">Old Anime</button>
 </div>
 <h2 id="heading">Popular Anime</h2>
 <div class="grid" id="grid"></div>
 <div class="status" id="status">Loading anime...</div>
</main>

<div class="modal" id="modal">
 <div class="panel">
  <button class="close" onclick="closeDetails()">CLOSE ✕</button>
  <div id="detailContent"></div>
  <h3>Choose Season</h3>
  <select id="seasonSelect"></select>
  <h3>Episodes</h3>
  <p class="muted">Select an episode to open the video player.</p>
  <div class="episodes" id="episodes"></div>
  <h3 id="playerTitle">Video Player</h3>
  <div class="player" id="player">
   <div class="player-message">Select an episode to begin.</div>
  </div>
 </div>
</div>

<footer>ANIMEOP • Anime information powered by AniList</footer>

<script>
const API = "https://graphql.anilist.co";

/*
 Add authorized video sources here.

 Example:
 VIDEO_SOURCES[ANIME_ID] = {
   1: "https://your-authorized-video-link/episode1.mp4",
   2: "https://www.youtube.com/embed/VIDEO_ID"
 };

 Use only videos you have permission to embed.
*/
const VIDEO_SOURCES = {};

let currentSort = "POPULARITY_DESC";
let currentPage = 1;
let currentAnime = null;
let searchTimer = null;

const grid = document.getElementById("grid");
const statusBox = document.getElementById("status");
const searchBox = document.getElementById("search");

async function loadAnime(search = "") {
 statusBox.textContent = "Loading anime...";
 grid.innerHTML = "";

 const query = `
 query ($page:Int, $search:String, $sort:[MediaSort]) {
  Page(page:$page, perPage:30) {
   media(
    type:ANIME,
    countryOfOrigin:JP,
    isAdult:false,
    search:$search,
    sort:$sort
   ) {
    id
    title { romaji english native }
    coverImage { large }
    description(asHtml:false)
    episodes
    seasonYear
    genres
    format
    status
   }
  }
 }`;

 try {
  const response = await fetch(API,{
   method:"POST",
   headers:{"Content-Type":"application/json","Accept":"application/json"},
   body:JSON.stringify({
    query,
    variables:{
     page:currentPage,
     search:search || null,
     sort:[currentSort]
    }
   })
  });

  if(!response.ok) throw new Error("API request failed");

  const result = await response.json();
  const animeList = result.data.Page.media;

  if(!animeList.length){
   statusBox.textContent = "No anime found.";
   return;
  }

  animeList.forEach(anime => {
   const card = document.createElement("div");
   card.className = "card";

   const img = document.createElement("img");
   img.src = anime.coverImage.large;
   img.alt = anime.title.romaji;
   img.loading = "lazy";

   const title = document.createElement("h3");
   title.textContent = anime.title.english || anime.title.romaji;

   const info = document.createElement("p");
   info.textContent = (anime.seasonYear || "Year unknown") +
    " • " + (anime.episodes || "?") + " Episodes";

   card.append(img,title,info);
   card.onclick = () => openDetails(anime);
   grid.appendChild(card);
  });

  statusBox.textContent = "Showing " + animeList.length + " anime";

 } catch(error) {
  statusBox.textContent =
   "Could not load anime. Check your internet and try again.";
 }
}

function openDetails(anime) {
 currentAnime = anime;
 document.getElementById("modal").style.display = "block";

 const content = document.getElementById("detailContent");
 content.innerHTML = "";

 const details = document.createElement("div");
 details.className = "details";

 const img = document.createElement("img");
 img.src = anime.coverImage.large;
 img.alt = anime.title.romaji;

 const info = document.createElement("div");

 const title = document.createElement("h2");
 title.textContent = anime.title.english || anime.title.romaji;

 const meta = document.createElement("p");
 meta.className = "muted";
 meta.textContent =
  "Year: " + (anime.seasonYear || "Unknown") +
  " | Episodes: " + (anime.episodes || "Unknown") +
  " | Format: " + (anime.format || "Unknown");

 const genres = document.createElement("p");
 genres.className = "muted";
 genres.textContent = "Genres: " + (anime.genres || []).join(", ");

 const description = document.createElement("p");
 description.className = "muted";
 description.textContent =
  anime.description || "No description available.";

 info.append(title,meta,genres,description);
 details.append(img,info);
 content.append(details);

 document.getElementById("player").innerHTML =
  '<div class="player-message">Select an episode to begin.</div>';
 document.getElementById("playerTitle").textContent = "Video Player";

 createSeasons(anime.episodes || 0);
}

function createSeasons(totalEpisodes) {
 const select = document.getElementById("seasonSelect");
 select.innerHTML = "";

 const total = Math.max(1,Math.ceil(totalEpisodes / 12));

 for(let season = 1; season <= total; season++){
  const option = document.createElement("option");
  option.value = season;
  option.textContent = "Season " + season;
  select.appendChild(option);
 }

 select.onchange = () => showEpisodes(totalEpisodes);
 showEpisodes(totalEpisodes);
}

function showEpisodes(totalEpisodes) {
 const season = Number(document.getElementById("seasonSelect").value);
 const list = document.getElementById("episodes");
 list.innerHTML = "";

 const start = (season - 1) * 12 + 1;
 const end = Math.min(season * 12,totalEpisodes);

 if(!totalEpisodes){
  list.textContent = "Episode count is not available.";
  return;
 }

 for(let episode = start; episode <= end; episode++){
  const button = document.createElement("button");
  button.textContent = "EP " + episode;
  button.onclick = () => playEpisode(episode);
  list.appendChild(button);
 }
}

function playEpisode(episode) {
 const animeId = currentAnime.id;
 const source = VIDEO_SOURCES[animeId]?.[episode];

 document.getElementById("playerTitle").textContent =
  "Episode " + episode;

 const player = document.getElementById("player");
 player.innerHTML = "";

 if(!source){
  const message = document.createElement("div");
  message.className = "player-message";
  message.textContent =
   "Video source not added yet. This episode needs an authorized video link.";
  player.appendChild(message);
  return;
 }

 if(!/^https:\/\//i.test(source)){
  player.innerHTML =
   '<div class="player-message">Invalid video link. Use a secure HTTPS link.</div>';
  return;
 }

 if(/\.(mp4|webm)(\?.*)?$/i.test(source)){
  const video = document.createElement("video");
  video.controls = true;
  video.playsInline = true;
  video.src = source;
  player.appendChild(video);
 } else {
  const frame = document.createElement("iframe");
  frame.src = source;
  frame.allow = "autoplay; encrypted-media; picture-in-picture";
  frame.allowFullscreen = true;
  frame.title = "Anime episode " + episode;
  player.appendChild(frame);
 }
}

function closeDetails() {
 document.getElementById("modal").style.display = "none";
 document.getElementById("player").innerHTML = "";
}

document.querySelectorAll(".tabs button").forEach(button => {
 button.addEventListener("click",() => {
  document.querySelectorAll(".tabs button").forEach(b =>
   b.classList.remove("active")
  );
  button.classList.add("active");
  currentSort = button.dataset.sort;

  const labels = {
   POPULARITY_DESC:"Popular Anime",
   START_DATE_DESC:"New Japanese Anime",
   START_DATE:"Classic Japanese Anime"
  };
  document.getElementById("heading").textContent = labels[currentSort];
  currentPage = 1;
  loadAnime(searchBox.value.trim());
 });
});

searchBox.addEventListener("input",() => {
 clearTimeout(searchTimer);
 searchTimer = setTimeout(() => {
  currentPage = 1;
  loadAnime(searchBox.value.trim());
 },500);
});

loadAnime();
</script>
</body>
</html>
