```html
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anime Dekho</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: #10121a; color: #fff;
    }
    header { padding: 22px 6%; background: #1a1d29; }
    h1 { margin: 0; color: #ff5b79; }
    main { padding: 24px 6%; }
    #status { color: #aaa; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px; margin-top: 20px;
    }
    .card { background: #1a1d29; border-radius: 12px; overflow: hidden; }
    .poster {
      height: 240px; display: grid; place-items: center;
      background: linear-gradient(135deg, #5838a8, #e84d76);
      font-size: 52px;
    }
    .info { padding: 14px; }
    .info h2 { font-size: 17px; margin: 0 0 8px; }
    .info p { color: #bbb; font-size: 14px; }
    a {
      display: inline-block; padding: 9px 13px; border-radius: 7px;
      background: #ff5b79; color: white; text-decoration: none;
    }
  </style>
</head>
<body>
  <header><h1>Anime Dekho</h1></header>
  <main>
    <h2>Naye Anime</h2>
    <p id="status">Anime list load ho rahi hai…</p>
    <section class="grid" id="anime-list"></section>
  </main>

  <script>
    // Demo data. Apne legal streaming page ke links yahan add karein.
    const anime = [
      { title: "Demon Slayer", episode: "Naya episode", watchUrl: "https://example.com" },
      { title: "Jujutsu Kaisen", episode: "Season 2", watchUrl: "https://example.com" },
      { title: "My Hero Academia", episode: "Latest episode", watchUrl: "https://example.com" }
    ];

    function showAnime() {
      const list = document.getElementById("anime-list");
      list.innerHTML = anime.map(item => `
        <article class="card">
          <div class="poster" aria-hidden="true">🎬</div>
          <div class="info">
            <h2>${item.title}</h2>
            <p>${item.episode}</p>
            <a href="${item.watchUrl}" target="_blank" rel="noopener">Dekhein</a>
          </div>
        </article>
      `).join("");

      document.getElementById("status").textContent =
        "List update hui: " + new Date().toLocaleTimeString();
    }

    showAnime();
    setInterval(showAnime, 30000);
  </script>
</body>
</html>
```
