
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANIMEOP</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080910;color:white;
 font-family:Arial,sans-serif
}
header{
 background:#11121c;padding:16px;
 display:flex;align-items:center;
 justify-content:space-between;gap:10px;
 position:sticky;top:0;z-index:5
}
.logo{font-size:26px;font-weight:bold;color:#a855f7}
input,select{
 background:#20212d;color:white;
 border:1px solid #444;padding:12px;
 border-radius:10px
}
input{width:55%}
button{
 background:#9333ea;color:white;border:0;
 padding:11px 15px;border-radius:9px;
 margin:4px;cursor:pointer
}
.categories{
 display:flex;overflow-x:auto;padding:10px
}
h2{margin:18px 14px}
.hero{
 margin:12px;padding:25px;
 background:linear-gradient(120deg,#35105c,#11121c);
 border-radius:15px
}
.grid{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:12px;padding:12px
}
.card{
 background:#171824;border-radius:12px;
 overflow:hidden;cursor:pointer
}
.card img{
 width:100%;aspect-ratio:3/4;object-fit:cover
}
.card h3{font-size:13px;padding:0 8px}
.card p{font-size:11px;color:#aaa;padding:0 8px}
#details{
 display:none;background:#13141f;
 margin:12px;padding:16px;border-radius:15px
}
#detailImage{
 width:125px;float:left;
 margin:0 14px 10px 0;border-radius:10px
}
#detailDescription{line-height:1.5;color:#ddd}
.clear{clear:both}
#episodeList{display:flex;flex-wrap:wrap;margin-top:12px}
#playerArea{display:none;padding:12px}
iframe{
 width:100%;aspect-ratio:16/9;
 border:0;border-radius:12px;background:black
}
.small{color:#aaa;font-size:13px}
footer{text-align:center;padding:25px;color:#777}
@media(min-width:700px){
 .grid{grid-template-columns:repeat(6,1fr)}
}
@media(max-width:360px){
 .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<header>
 <div class="logo">ANIMEOP</div>
 <input id="search" placeholder="Search anime..."
 onkeydown="if(event.key==='Enter')searchAnime()">
</header>

<section class="hero">
 <h1>ANIMEOP</h1>
 <p>Explore Your Anime World</p>
 <button onclick="loadAnime('TRENDING_DESC')">
 Explore Anime
 </button>
</section>

<div class="categories">
 <button onclick="loadAnime('TRENDING_DESC')">Trending</button>
 <button onclick="loadAnime('POPULARITY_DESC')">Popular</button>
 <button onclick="loadAnime('SCORE_DESC')">Top Rated</button>
 <button onclick="loadAnime('START_DATE_DESC')">Latest</button>
</div>

<h2 id="heading">🔥 Trending Anime</h2>
<div class="grid" id="animeList"></div>

<section id="details">
 <button onclick="closeDetails()">← Back</button>
 <br><br>

 <img id="detailImage">

 <h2 id="detailTitle"></h2>
 <p id="detailInfo" class="small"></p>
 <p id="detailDescription"></p>

 <div class="clear"></div>

 <h3>Season & Episodes</h3>

 <div id="seasonArea">
  <select id="seasonSelect" onchange="showEpisodes()"></select>
 </div>

 <div id="episodeList"></div>

 <p id="episodeMessage" class="small"></p>
</section>

<section id="playerArea">
 <h2>Anime Player</h2>
 <iframe id="player"
 allowfullscreen
 allow="autoplay; encrypted-media; picture-in-picture">
 </iframe>
 <p class="small">Authorized video source only.</p>
</section>

<footer>ANIMEOP © 2026</footer>

<script>
const API="https://graphql.anilist.co";

let animeData=[];
let currentAnime="";

/*
 ADD AUTHORIZED VIDEO IDS HERE.

 Example:
 "Anime Name": {
   "Season 1": {
      "1": "YOUTUBE_VIDEO_ID",
      "2": "YOUTUBE_VIDEO_ID"
   },
   "Season 2": {
      "1": "YOUTUBE_VIDEO_ID"
   }
 }

 Leave empty until you have authorized video IDs.
*/

const VIDEO_LIBRARY = {

 "Witch Hunter Robin": {
   "Season 1": {
     "1": "",
     "2": "",
     "3": ""
   }
 }

};

async function loadAnime(sort="TRENDING_DESC"){

 document.getElementById("heading").textContent=
 "Anime Collection";

 document.getElementById("animeList").innerHTML=
 "<p>Loading anime...</p>";

 const query=`
 query {
  Page(perPage:30) {
   media(type:ANIME,sort:${sort},isAdult:false) {
    id
    title { english romaji }
    coverImage { large }
    episodes
    seasonYear
    averageScore
    description(asHtml:false)
   }
  }
 }`;

 try{
  const response=await fetch(API,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({query})
  });

  const result=await response.json();

  if(result.errors)throw new Error("API error");

  animeData=result.data.Page.media;
  showAnime(animeData);

 }catch(error){
  document.getElementById("animeList").innerHTML=
  "<p>Anime load nahi hua. Internet check karke refresh karo.</p>";
 }
}

function showAnime(list){

 const box=document.getElementById("animeList");
 box.innerHTML="";

 list.forEach(anime=>{

  const card=document.createElement("div");
  card.className="card";

  const img=document.createElement("img");
  img.src=anime.coverImage.large;
  img.alt=anime.title.english||anime.title.romaji;

  const title=document.createElement("h3");
  title.textContent=anime.title.english||anime.title.romaji;

  const info=document.createElement("p");
  info.textContent=
  (anime.seasonYear||"Anime")+" • "+
  (anime.episodes||"?")+" Episodes";

  card.append(img,title,info);

  card.onclick=()=>openDetails(anime.id);

  box.appendChild(card);
 });
}

async function searchAnime(){

 const value=document.getElementById("search").value.trim();

 if(!value){
  loadAnime();
  return;
 }

 document.getElementById("animeList").innerHTML=
 "<p>Searching...</p>";

 const query=`
 query {
  Page(perPage:30) {
   media(type:ANIME,search:"${value.replace(/["\\]/g,"")}",isAdult:false) {
    id
    title { english romaji }
    coverImage { large }
    episodes
    seasonYear
    averageScore
    description(asHtml:false)
   }
  }
 }`;

 try{
  const response=await fetch(API,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({query})
  });

  const result=await response.json();
  animeData=result.data.Page.media;
  showAnime(animeData);

 }catch(error){
  document.getElementById("animeList").innerHTML=
  "<p>Search failed. Try again.</p>";
 }
}

function openDetails(id){

 const a=animeData.find(x=>x.id===id);
 if(!a)return;

 currentAnime=a.title.english||a.title.romaji;

 document.getElementById("details").style.display="block";
 document.getElementById("playerArea").style.display="none";
 document.getElementById("player").src="";

 document.getElementById("detailImage").src=
 a.coverImage.large;

 document.getElementById("detailTitle").textContent=
 currentAnime;

 document.getElementById("detailInfo").textContent=
 "Year: "+(a.seasonYear||"Unknown")+
 " | Episodes: "+(a.episodes||"Unknown")+
 " | Score: "+(a.averageScore||"N/A");

 document.getElementById("detailDescription").textContent=
 a.description||"Description not available.";

 setupSeasons();

 document.getElementById("details").scrollIntoView({
  behavior:"smooth"
 });
}

function setupSeasons(){

 const select=document.getElementById("seasonSelect");
 select.innerHTML="";

 const data=VIDEO_LIBRARY[currentAnime];

 if(!data){
  document.getElementById("episodeList").innerHTML="";
  document.getElementById("episodeMessage").textContent=
  "Authorized episodes abhi add nahi kiye gaye hain.";
  return;
 }

 Object.keys(data).forEach(season=>{
  const option=document.createElement("option");
  option.value=season;
  option.textContent=season;
  select.appendChild(option);
 });

 showEpisodes();
}

function showEpisodes(){

 const season=document.getElementById("seasonSelect").value;
 const episodes=VIDEO_LIBRARY[currentAnime]?.[season]||{};

 const box=document.getElementById("episodeList");
 const message=document.getElementById("episodeMessage");

 box.innerHTML="";
 message.textContent="";

 Object.keys(episodes).forEach(number=>{

  const btn=document.createElement("button");
  btn.textContent="Episode "+number;

  btn.onclick=()=>playEpisode(episodes[number]);

  box.appendChild(btn);
 });

 if(Object.keys(episodes).length===0){
  message.textContent="Episodes abhi available nahi hain.";
 }
}

function playEpisode(id){

 if(!id){
  alert("Is episode ka authorized video ID abhi add nahi hai.");
  return;
 }

 if(!/^[a-zA-Z0-9_-]{11}$/.test(id)){
  alert("Video ID valid nahi hai.");
  return;
 }

 document.getElementById("player").src=
 "https://www.youtube-nocookie.com/embed/"+id;

 document.getElementById("playerArea").style.display="block";

 document.getElementById("playerArea").scrollIntoView({
  behavior:"smooth"
 });
}

function closeDetails(){

 document.getElementById("details").style.display="none";
 document.getElementById("playerArea").style.display="none";
 document.getElementById("player").src="";
}

loadAnime();
</script>

</body>
</html>
